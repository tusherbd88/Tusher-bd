<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tusher BD - Premium Movie Portal</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #e50914; /* Netflix Red */
            --accent: #38bdf8;  /* Neon Blue */
            --bg-dark: #070a12;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-light: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Top Header Bar */
        .top-bar {
            background: #020617;
            padding: 8px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .clock-box {
            color: var(--accent);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-contact {
            color: #cbd5e1;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-contact i { color: var(--primary); }

        .lang-select {
            background: #0f172a;
            color: #fff;
            border: 1px solid #334155;
            padding: 3px 8px;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        /* Header / Navbar */
        header {
            background: rgba(7, 10, 18, 0.9);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(15px);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: var(--accent);
            text-decoration: none;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .logo span { color: var(--primary); text-shadow: 0 0 12px rgba(229, 9, 20, 0.4); }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-links a {
            color: #e2e8f0;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-links a:hover { color: var(--accent); }

        /* Hero Cinema Banner */
        .hero {
            padding: 60px 5%;
            background: linear-gradient(90deg, rgba(7, 10, 18, 0.95) 0%, rgba(7, 10, 18, 0.6) 100%), url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80') center/cover;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hero-content {
            max-width: 650px;
        }

        .badge {
            background: var(--primary);
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.5);
        }

        .hero h1 {
            font-size: 38px;
            margin: 12px 0;
            color: #fff;
            font-weight: 700;
            line-height: 1.2;
        }

        .hero p {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .hero-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.4);
            transition: 0.3s;
        }

        .hero-btn:hover {
            transform: scale(1.05);
            background: #ff121d;
        }

        /* Movie Section */
        main { padding: 40px 5%; }

        .section-title {
            margin-bottom: 25px;
            border-left: 4px solid var(--accent);
            padding-left: 12px;
            font-size: 24px;
            font-weight: 700;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 25px;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--accent);
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.25);
        }

        .movie-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }

        .play-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 300px;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.3s;
        }

        .movie-card:hover .play-overlay {
            opacity: 1;
        }

        .play-btn-icon {
            background: var(--primary);
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.8);
        }

        .movie-info {
            padding: 15px;
        }

        .movie-info h3 {
            font-size: 17px;
            color: #fff;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #94a3b8;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 40px 0 10px;
        }

        .page-btn {
            background: #0f172a;
            color: #fff;
            border: 1px solid #334155;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: 0.3s;
        }

        .page-btn.active, .page-btn:hover {
            background: var(--accent);
            color: #020617;
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        /* Movie Request Section */
        .request-section {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            padding: 35px;
            border-radius: 16px;
            margin: 40px 5%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .request-form {
            display: flex;
            gap: 12px;
            max-width: 500px;
            margin: 20px auto 0;
        }

        .request-form input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 30px;
            border: 1px solid #334155;
            background: #020617;
            color: #fff;
            outline: none;
        }

        .request-form button {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Video Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            width: 90%;
            max-width: 750px;
            background: #000;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
        }

        .close-btn {
            position: absolute;
            top: -38px;
            right: 0;
            color: #fff;
            font-size: 32px;
            cursor: pointer;
        }

        /* Gorgeous Footer */
        footer {
            background: #020617;
            padding: 40px 5% 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 50px;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
            text-align: left;
        }

        .footer-box h4 {
            color: var(--accent);
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--primary);
            display: inline-block;
            padding-bottom: 5px;
        }

        .footer-box p, .footer-box li {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 10px;
            list-style: none;
        }

        .footer-box i {
            color: var(--primary);
            margin-right: 8px;
        }

        .social-icons {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }

        .social-icons a {
            color: #fff;
            background: #1e293b;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-decoration: none;
            transition: 0.3s;
        }

        .social-icons a:hover {
            background: var(--primary);
            transform: scale(1.1);
        }

        .footer-bottom {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="clock-box">
            <i class="fa-regular fa-clock"></i> <span id="liveClock">00:00:00 AM</span>
        </div>
        <a href="tel:01728170476" class="top-contact">
            <i class="fa-solid fa-phone"></i> 01728170476
        </a>
        <div>
            <i class="fa-solid fa-globe"></i> 
            <select class="lang-select" id="langSelect" onchange="changeLanguage()">
                <option value="bn">বাংলা (Bengali)</option>
                <option value="en">English</option>
                <option value="bng">Banglish</option>
            </select>
        </div>
    </div>

    <!-- Header -->
    <header>
        <a href="#" class="logo">TUSHER <span>BD</span></a>
        <ul class="nav-links">
            <li><a href="#" id="txtHome">হোম</a></li>
            <li><a href="#movies" id="txtMovies">সিনেমা</a></li>
            <li><a href="#request" id="txtRequest">রিকোয়েস্ট</a></li>
            <li><a href="#contact" id="txtContact">যোগাযোগ</a></li>
        </ul>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <span class="badge">ট্রেন্ডিং এক্সক্লুসিভ</span>
            <h1 id="heroTitle">তুফান (Toofan) - অফিশিয়াল ট্রেইলার</h1>
            <p id="heroDesc">নব্বই দশকের এক গ্যাংস্টারের উত্থান ও রাজত্বের রোমাঞ্চকর গল্প। শাকিব খান ও চঞ্চল চৌধুরীর দুর্দান্ত অ্যাকশন উপভোগ করুন!</p>
            <button class="hero-btn" onclick="openTrailer('https://www.youtube.com/embed/NcfmOXFh1Ig')">
                <i class="fa-solid fa-play"></i> ট্রেইলার প্লে করুন
            </button>
        </div>
    </section>

    <!-- Movie Section -->
    <main id="movies">
        <h2 class="section-title" id="txtCatTitle">জনপ্রিয় অফিশিয়াল মুভি ট্রেইলার কালেকশন</h2>
        
        <div class="movie-grid" id="movieGrid">
