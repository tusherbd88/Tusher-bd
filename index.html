<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tusher BD - Official Movie Portal</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #e50914;
            --accent: #38bdf8;
            --bg-dark: #0b0f19;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        /* Top Bar & Red Clock */
        .top-bar {
            background: #020617;
            padding: 8px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .clock-box {
            color: #ff2222;
            font-weight: 700;
            white-space: nowrap;
            font-size: 14px;
        }

        .clock-box i {
            color: #ff2222;
            margin-right: 5px;
        }

        .moving-movies {
            flex: 1;
            margin: 0 15px;
            overflow: hidden;
            white-space: nowrap;
            color: #38bdf8;
            font-weight: 600;
        }

        /* Navbar */
        header {
            background: rgba(11, 15, 25, 0.95);
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent);
            text-decoration: none;
        }

        .logo span { color: var(--primary); }

        .nav-links {
            display: flex;
            gap: 15px;
            list-style: none;
        }

        .nav-links a {
            color: #e2e8f0;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .nav-links a:hover { color: var(--accent); }

        /* Hero Banner */
        .hero {
            padding: 35px 5%;
            background: linear-gradient(rgba(11, 15, 25, 0.8), rgba(11, 15, 25, 0.9)), url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80') center/cover;
            border-bottom: 1px solid #1e293b;
        }

        .badge {
            background: var(--primary);
            color: #fff;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .hero h1 {
            font-size: 26px;
            margin: 10px 0;
            color: #fff;
        }

        .hero p {
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .hero-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        main { padding: 25px 5%; }
