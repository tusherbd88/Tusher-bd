<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tusher BD - Official Movie Portal</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #e50914;
            --accent: #38bdf8;
            --bg-dark: #0b0f19;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header Bar */
        .top-bar {
            background: #020617;
            padding: 8px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .clock-box {
            color: var(--accent);
            font-weight: bold;
        }

        .top-contact {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 12px;
        }

        .top-contact i { color: var(--primary); }

        /* Header / Navbar */
        header {
            background: rgba(11, 15, 25, 0.95);
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent);
            text-decoration: none;
        }

        .logo span { color: var(--primary); }

        .nav-links {
            display: flex;
            gap: 15px;
            list-style: none;
        }

        .nav-links a {
            color: #e2e8f0;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        /* Hero Banner */
        .hero {
            padding: 40px 5%;
            background: linear-gradient(rgba(11, 15, 25, 0.85), rgba(11, 15, 25, 0.95)), url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80') center/cover;
            border-bottom: 1px solid #1e293b;
        }

        .badge {
            background: var(--primary);
            color: #fff;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .hero h1 {
            font-size: 28px;
            margin: 10px 0;
            color: #fff;
        }

        .hero p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .hero-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        /* Movie Grid */
        main { padding: 30px 5%; }

        .section-title {
            margin-bottom: 20px;
            border-left: 4px solid var(--accent);
            padding-left: 10px;
            font-size: 20px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 18px;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #334155;
            cursor: pointer;
            transition: 0.3s;
        }

        .movie-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }

        .movie-info {
            padding: 10px;
        }

        .movie-info h3 {
            font-size: 15px;
            color: #fff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #94a3b8;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px 0 10px;
        }

        .page-btn {
            background: #0f172a;
            color: #fff;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .page-btn.active, .page-btn:hover {
            background: var(--accent);
            color: #020617;
            border-color: var(--accent);
        }

        /* Movie Request Section */
        .request-section {
            background: #0f172a;
            padding: 25px;
            border-radius: 12px;
            margin: 30px 5%;
            border: 1px solid #1e293b;
            text-align: center;
        }

        .request-form {
            display: flex;
            gap: 10px;
            max-width: 450px;
            margin: 15px auto 0;
        }

        .request-form input {
            flex: 1;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #334155;
            background: #020617;
            color: #fff;
            outline: none;
        }

        .request-form button {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Trailer Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            width: 90%;
            max-width: 700px;
            background: #000;
            border-radius: 10px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: -35px;
            right: 0;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
        }

        /* Footer */
        footer {
            background: #020617;
            padding: 30px 5% 20px;
            border-top: 1px solid #1e293b;
            margin-top: 40px;
        }

        .footer-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        .footer-box {
            flex: 1;
            min-width: 250px;
        }

        .footer-box h4 {
            color: var(--accent);
            font-size: 16px;
            margin-bottom: 10px;
        }

        .footer-box p, .footer-box li {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 8px;
            list-style: none;
        }

        .footer-box i { color: var(--primary); margin-right: 6px; }

        .footer-bottom {
            text-align: center;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
