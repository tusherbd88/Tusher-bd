<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tusher BD - Your Digital Solution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* Global Styles & Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; line-height: 1.6; overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }
    
    /* Header & Nav */
    header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #1e293b; padding: 1rem 2rem; }
    header > div { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    header .logo { font-size: 1.5rem; font-weight: 700; color: #38bdf8; }
    header nav a { margin-left: 1.5rem; transition: color 0.3s; }
    header nav a:hover { color: #38bdf8; }

    /* Hero Section */
    section { padding: 4rem 2rem; max-width: 1200px; margin: 0 auto; }
    .hero { text-align: center; padding: 5rem 1rem; }
    .hero h1 { font-size: 2.8rem; margin-bottom: 1rem; color: #ffffff; }
    .hero h1 span { color: #38bdf8; }
    .hero p { font-size: 1.2rem; color: #94a3b8; max-width: 600px; margin: 0 auto 2rem; }
    
    /* Service & Feature Cards Grid */
    .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
    article { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.8rem; transition: transform 0.3s, border-color 0.3s; }
    article:hover { transform: translateY(-5px); border-color: #38bdf8; }
    article .icon { font-size: 2.5rem; margin-bottom: 1rem; }
    article h3 { font-size: 1.3rem; margin-bottom: 0.5rem; color: #f1f5f9; }
    article p { font-size: 0.95rem; color: #94a3b8; margin-bottom: 1.2rem; }
    
    /* Buttons & Forms */
    .btn { display: inline-block; background: #0284c7; color: #fff; padding: 0.6rem 1.4rem; border-radius: 8px; font-weight: 600; transition: background 0.3s; border: none; cursor: pointer; }
    .btn:hover { background: #0369a1; }
    
    .order-container { background: #1e293b; border-radius: 12px; padding: 2rem; border: 1px solid #334155; margin-top: 2rem; }
    form input, form select, form textarea { width: 100%; padding: 0.8rem; margin-bottom: 1rem; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; }
    form input:focus, form select:focus, form textarea:focus { border-color: #38bdf8; outline: none; }
    
    /* AI Widget Floating Box */
    .ai-widget { position: fixed; bottom: 20px; right: 20px; background: #0284c7; color: white; padding: 12px 20px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); cursor: pointer; display: flex; align-items: center; gap: 8px; z-index: 1000; transition: transform 0.2s; }
    .ai-widget:hover { transform: scale(1.05); }

    /* Footer */
    footer { background: #090d16; padding: 3rem 2rem 1rem; border-top: 1px solid #1e293b; margin-top: 4rem; }
    footer .footer-content { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 2rem; }
    footer .copyright { text-align: center; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #1e293b; color: #64748b; font-size: 0.85rem; }
  </style>
</head>
