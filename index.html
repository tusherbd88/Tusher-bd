<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tusher BD - Official Movie Portal</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #e50914;
            --accent: #38bdf8;
            --bg-dark: #0b0f19;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        /* Top Bar & Red Clock */
        .top-bar {
            background: #020617;
            padding: 8px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .clock-box {
            color: #ff2222;
            font-weight: 700;
            white-space: nowrap;
            font-size: 14px;
        }

        .clock-box i {
            color: #ff2222;
            margin-right: 5px;
        }

        .moving-movies {
            flex: 1;
            margin: 0 15px;
            overflow: hidden;
            white-space: nowrap;
            color: var(--accent);
            font-weight: 600;
        }

        /* Navbar */
        header {
            background: rgba(11, 15, 25, 0.95);
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent);
            text-decoration: none;
        }

        .logo span { color: var(--primary); }

        .nav-links {
            display: flex;
            gap: 15px;
            list-style: none;
        }

        .nav-links a {
            color: #e2e8f0;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .nav-links a:hover { color: var(--accent); }

        /* Top Slider / Hero Section */
        .hero-slider-container {
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid #1e293b;
        }

        .hero-slider {
            display: flex;
            transition: transform 0.5s ease-in-out;
            width: 100%;
        }

        .hero-slide {
            min-width: 100%;
            padding: 40px 5%;
            background-size: cover;
            background-position: center;
            position: relative;
        }
